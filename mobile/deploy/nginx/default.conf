server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/manifest+json
        application/wasm image/svg+xml text/css text/plain;

    location = /healthz {
        access_log off;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://backend:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /flutter_service_worker.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location /downloads/ {
        include /etc/nginx/security-headers.conf;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="MonCV.apk"' always;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
        limit_except GET { deny all; }
    }

    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    # Aucun fichier produit par `flutter build web` n'est versionne par son nom :
    # main.dart.js, flutter_bootstrap.js, assets/ et canvaskit/ gardent la meme URL
    # d'un build a l'autre. Un max-age sans revalidation sert donc du code perime
    # apres chaque deploiement, pendant toute la duree du cache.
    #
    # no-cache n'est pas no-store : le navigateur conserve la copie mais doit la
    # revalider. nginx repond 304 tant que le contenu n'a pas bouge, et 200 des le
    # deploiement suivant. Les 8,9 Mo du bundle ne sont pas retransmis a chaque fois.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
        limit_except GET { deny all; }
    }
}
