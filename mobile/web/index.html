<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Créez et gérez votre CV professionnel en ligne">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#2563EB">
  <meta name="application-name" content="MonCV">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MonCV">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <meta name="msapplication-TileColor" content="#2563EB">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MonCV - Créateur de CV Professionnel</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #pwa-install {
      display: none;
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 9999;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border: 0;
      border-radius: 12px;
      background: #2563EB;
      color: #fff;
      font: 600 14px/1.3 system-ui, sans-serif;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.25);
      cursor: pointer;
    }
    #pwa-install.visible { display: flex; }
  </style>
</head>
<body>
  <button id="pwa-install" type="button">Installer MonCV</button>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js');
      });
    }
    (function () {
      var btn = document.getElementById('pwa-install');
      var deferred = null;
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        deferred = event;
        btn.classList.add('visible');
      });
      btn.addEventListener('click', function () {
        if (!deferred) return;
        deferred.prompt();
        deferred = null;
        btn.classList.remove('visible');
      });
      window.addEventListener('appinstalled', function () {
        btn.classList.remove('visible');
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
