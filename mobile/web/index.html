<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Créez et gérez votre CV professionnel en ligne">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#2563EB">
  <meta name="application-name" content="MonCV">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MonCV">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <meta name="msapplication-TileColor" content="#2563EB">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MonCV - Créateur de CV Professionnel</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    if ('serviceWorker' in navigator) {
      var nativeRegister = navigator.serviceWorker.register.bind(navigator.serviceWorker);
      navigator.serviceWorker.register = function (url, options) {
        if (String(url).indexOf('flutter_service_worker') !== -1) {
          return nativeRegister('/sw.js', options);
        }
        return nativeRegister(url, options);
      };
      window.addEventListener('load', function () {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (reg) {
            var script = (reg.active && reg.active.scriptURL) || '';
            if (script.indexOf('flutter_service_worker') !== -1) {
              reg.unregister();
            }
          });
        });
        nativeRegister('/sw.js');
      });
    }
    window.__moncvDeferred = null;
    window.addEventListener('beforeinstallprompt', function (event) {
      event.preventDefault();
      window.__moncvDeferred = event;
    });
    window.promptMoncvInstall = function () {
      function runPrompt(deferred) {
        window.__moncvDeferred = null;
        deferred.prompt();
        return deferred.userChoice.then(function (choice) {
          return choice.outcome;
        });
      }
      if (window.__moncvDeferred) {
        return runPrompt(window.__moncvDeferred);
      }
      return new Promise(function (resolve) {
        var timer = setTimeout(function () {
          window.removeEventListener('beforeinstallprompt', onPrompt);
          resolve('unavailable');
        }, 2000);
        function onPrompt(event) {
          event.preventDefault();
          clearTimeout(timer);
          window.removeEventListener('beforeinstallprompt', onPrompt);
          runPrompt(event).then(resolve);
        }
        window.addEventListener('beforeinstallprompt', onPrompt);
      });
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
