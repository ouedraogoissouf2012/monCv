name: cv_mobile
description: Application mobile de creation de CV

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  flutter_svg: ^2.0.9

  # State Management
  provider: ^6.1.1
  get_it: ^7.6.7

  # HTTP & API
  http: ^1.1.0
  http_parser: ^4.0.0
  dio: ^5.4.0

  # Storage
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^9.0.0

  # Navigation
  go_router: ^13.0.0

  # Connectivity
  connectivity_plus: ^6.1.4
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  sentry_flutter: ^8.14.2

  # File picker (import CV)
  file_picker: ^8.0.0

  # PDF generation (client-side)
  pdf: ^3.10.8
  printing: ^5.12.0

  # Utils
  intl: any
  image_picker: ^1.0.5
  path_provider: ^2.1.1
  open_file: ^3.3.2
  url_launcher: ^6.3.1
  qr_flutter: ^4.1.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  mocktail: ^1.0.4
  accessibility_tools: ^2.8.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # Polices embarquees : source unique de la charte typographique de l'app.
  # Aucun ecran n'appelle GoogleFonts au runtime (issue #233). La famille par
  # defaut est resolue via AppTypography.fontFamilyBody / fontFamilyDisplay.
  # Playfair Display est une police variable (axe wght) : Flutter selectionne
  # l'instance la plus proche du FontWeight demande.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay-VariableFont_wght.ttf
