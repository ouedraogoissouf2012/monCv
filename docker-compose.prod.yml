# Override prod : utilise avec docker-compose.yml
# Usage : docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Les secrets sont interpoles depuis l'orchestrateur ou un --env-file protege.
# Aucun fichier d'environnement n'est monte dans les conteneurs.

services:
  postgres:
    # Pas de ports exposes en prod (DB interne)
    ports: !override []
    environment:
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    networks: !override
      - data-net

  redis:
    # Redis reste strictement interne au reseau Docker en production.
    ports: !override []
    networks: !override
      - data-net

  backend:
    # Utilise l'image GHCR au lieu de builder localement
    build: !reset null
    image: ghcr.io/ouedraogoissouf2012/cv-mobile-backend:${TAG:?TAG must be a full 40-character Git SHA}

    # Pas de env_file — secrets injectes par l'orchestrateur
    env_file: !reset []

    ports: !override []

    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/cvmobile
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION: ${JWT_EXPIRATION:?JWT_EXPIRATION is required}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:?JWT_REFRESH_EXPIRATION is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      SHOW_SQL: "false"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      AI_FALLBACK_ENABLED: "false"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_ADMIN_BYPASS: "false"
      RATE_LIMIT_REDIS_URL: redis://redis:6379
      PUBLIC_LINK_ENCRYPTION_KEY: ${PUBLIC_LINK_ENCRYPTION_KEY:?PUBLIC_LINK_ENCRYPTION_KEY is required}
      PUBLIC_MEDIA_ALLOWED_ORIGINS: ${PUBLIC_MEDIA_ALLOWED_ORIGINS:?PUBLIC_MEDIA_ALLOWED_ORIGINS is required}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
      # Reset password par email (issue #487). Desactive par defaut -> repli logging.
      # Passer MAIL_ENABLED=true impose des creds SMTP valides (voir .env.production.example
      # et ProductionConfigurationPolicy). Aucune credential reelle n'est stockee ici.
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@moncv.app}

    networks: !override
      - edge-net
      - data-net

  web:
    image: ghcr.io/ouedraogoissouf2012/cv-mobile-web:${TAG:?TAG must be a full 40-character Git SHA}
    container_name: cvmobile-web
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
      - /var/cache/nginx:size=32m,noexec,nosuid,nodev
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    volumes:
      - ./downloads:/usr/share/nginx/html/downloads:ro
    networks: !override
      - edge-net

  adminer:
    profiles:
      - dev-tools
    ports: !override []
    networks: !override
      - data-net

networks:
  edge-net:
    driver: bridge
  data-net:
    driver: bridge
    internal: true
