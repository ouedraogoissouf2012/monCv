repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: detect hardcoded secrets
        entry: python tools/quality/run_gitleaks.py
        language: system
        pass_filenames: false
        always_run: true
      - id: source-line-policy
        name: source line policy (300 max)
        entry: python tools/quality/check_source_lines.py
        language: system
        pass_filenames: false
        always_run: true
