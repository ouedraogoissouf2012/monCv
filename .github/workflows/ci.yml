name: CI — Build & Test

on:
  push:
    branches: [main, develop, 'feature/**', 'issue-*']
  pull_request:
    branches: [main, develop]

jobs:
  # ── Backend (Spring Boot) ──────────────────────────────────
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build & Test
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DEEPSEEK_API_KEY: ""
        run: mvn clean verify -q

      - name: Upload Jacoco report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: backend/target/site/jacoco

      - name: Upload backend coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: backend/target/site/jacoco/jacoco.xml
          flags: backend
          fail_ci_if_error: false

  # ── Frontend (Flutter) ─────────────────────────────────────
  frontend:
    name: Frontend — Analyze & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate localizations
        working-directory: mobile
        run: flutter gen-l10n

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        working-directory: mobile
        run: flutter test --coverage --no-pub --exclude-tags web-smoke --concurrency=1

      - name: Enforce Flutter coverage
        working-directory: mobile
        run: dart run tool/check_coverage.dart --summary=coverage/summary.md

      - name: Upload Flutter coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-lcov-report
          path: |
            mobile/coverage/lcov.info
            mobile/coverage/summary.md

      - name: Comment coverage on pull request
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: flutter-coverage
          path: mobile/coverage/summary.md

      - name: Upload Flutter coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: mobile/coverage/lcov.info
          flags: flutter
          fail_ci_if_error: false

  # ── Smoke E2E Web (backend réel + Flutter Web) ───────────────
  web-smoke:
    name: Web Smoke E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cvmobile_smoke
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Start backend
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/cvmobile_smoke
          DB_USERNAME: postgres
          DB_PASSWORD: test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DEEPSEEK_API_KEY: ""
          SERVER_PORT: 8082
          ALLOWED_ORIGINS: "http://localhost:*,http://127.0.0.1:*"
          MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: "readinessState,db"
        run: |
          nohup mvn spring-boot:run -q > ../backend-smoke.log 2>&1 &
          echo $! > ../backend-smoke.pid

      - name: Wait for backend
        run: |
          for i in {1..90}; do
            if curl -fsS http://localhost:8082/actuator/health/readiness; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy"
          tail -n 200 backend-smoke.log || true
          exit 1

      - name: Build web release
        working-directory: mobile
        run: flutter build web --release --no-pub --dart-define=API_BASE_URL=http://localhost:8082/api

      - name: Run web smoke
        working-directory: mobile
        run: flutter test test/e2e/cv_smoke_web_test.dart --platform chrome --no-pub --tags web-smoke --timeout 5m --reporter expanded --file-reporter json:../web-smoke-test-results.json --dart-define=API_BASE_URL=http://localhost:8082/api

      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-logs
          path: |
            backend-smoke.log
            web-smoke-test-results.json

      - name: Build PWA web bundle
        working-directory: mobile
        run: >
          flutter build web --release --no-pub --pwa-strategy=offline-first
          --dart-define=APP_ENV=production
          --dart-define=API_BASE_URL=https://api.moncv.example/api
          -o build/web-pwa

  docker-verify:
    name: Docker — Build & Trivy scan
    runs-on: ubuntu-latest
    needs: [backend]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          load: true
          push: false
          tags: moncv-backend:${{ github.sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: moncv-backend:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  # ── Docker publish (sur main et tags release) ──────────────
  docker-publish:
    name: Backend — Build & Push Docker image
    runs-on: ubuntu-latest
    needs: [backend, docker-verify]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cv-mobile-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/cv-mobile-backend:latest

  # ── Build APK (sur tags release) ───────────────────────────
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: [backend, frontend, web-smoke]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: stable

      - name: Build APK
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
