name: CI — Build & Test

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-policy:
    name: Quality — Source policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Test source line guard
        run: python -m unittest discover -s tools/quality/tests -p 'test_*.py'

      - name: Test CI workflow security guard
        run: python -m unittest discover -s tools/ci/tests -p 'test_*.py'

      - name: Enforce CI workflow security policy
        run: python -m tools.ci.check_workflow_security

      - name: Extract base source policy
        env:
          REFERENCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "$REFERENCE_SHA:tools/quality/source_line_policy.json" 2>/dev/null; then
            git show "$REFERENCE_SHA:tools/quality/source_line_policy.json" > "$RUNNER_TEMP/source_line_policy.base.json"
          else
            cp tools/quality/source_line_policy.json "$RUNNER_TEMP/source_line_policy.base.json"
          fi

      - name: Enforce 300-line source policy
        run: >-
          python tools/quality/check_source_lines.py
          --reference-policy "$RUNNER_TEMP/source_line_policy.base.json"

      - name: Enforce Flutter presentation import boundary
        run: python -m tools.quality.flutter_import_guard

  # ── Backend (Spring Boot) ──────────────────────────────────
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest
    needs: [source-policy]
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Java 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build & Test
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: test
          JWT_SECRET: MonCV-CI-ONLY-NOT-PRODUCTION-A7zQ9mK2xR8pL4vN6sT1wY5cD3fH0jU7K5pR9xW2
          DEEPSEEK_API_KEY: ""
        run: mvn clean verify -q

      - name: Upload Jacoco report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-jacoco-report
          path: backend/target/site/jacoco

  # ── Frontend (Flutter) ─────────────────────────────────────
  frontend:
    name: Frontend — Analyze & Test
    runs-on: ubuntu-latest
    needs: [source-policy]
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: mobile/.fvmrc
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate localizations
        working-directory: mobile
        run: flutter gen-l10n

      - name: Verify generated localizations are committed
        run: >-
          git diff --exit-code --
          mobile/lib/l10n/app_localizations.dart
          mobile/lib/l10n/app_localizations_en.dart
          mobile/lib/l10n/app_localizations_fr.dart

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        working-directory: mobile
        run: flutter test --coverage --no-pub --exclude-tags web-smoke --concurrency=1

      - name: Enforce Flutter coverage
        working-directory: mobile
        run: dart run tool/check_coverage.dart --summary=coverage/summary.md

      - name: Upload Flutter coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flutter-lcov-report
          path: |
            mobile/coverage/lcov.info
            mobile/coverage/summary.md

  # ── Smoke E2E Web (backend réel + Flutter Web) ───────────────
  web-smoke:
    name: Web Smoke E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 35
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cvmobile_smoke
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Java 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: mobile/.fvmrc
          channel: stable
          cache: true

      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.11.29'
          enable-cache: true

      - name: Install browser smoke dependencies
        run: uv sync --locked --python 3.12.13

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Start backend
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/cvmobile_smoke
          DB_USERNAME: postgres
          DB_PASSWORD: test
          JWT_SECRET: MonCV-SMOKE-ONLY-NOT-PRODUCTION-Q4mN7vR2xK9pL5sT1wY6cD3fH8jU0eA7zB
          DEEPSEEK_API_KEY: ""
          SERVER_PORT: 8082
          ALLOWED_ORIGINS: "http://localhost:*,http://127.0.0.1:*"
          MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: "readinessState,db"
        run: |
          nohup mvn spring-boot:run -q > ../backend-smoke.log 2>&1 &
          echo $! > ../backend-smoke.pid

      - name: Wait for backend
        run: |
          for i in {1..90}; do
            if curl -fsS http://localhost:8082/actuator/health/readiness; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy"
          tail -n 200 backend-smoke.log || true
          exit 1

      - name: Build web release
        working-directory: mobile
        run: flutter build web --release --no-pub --dart-define=API_BASE_URL=http://localhost:8082/api

      - name: Serve web release
        run: |
          nohup python3 -m http.server 8083 --directory mobile/build/web > web-smoke.log 2>&1 &
          echo $! > web-smoke.pid

      - name: Run web smoke
        run: >
          uv run --locked python -m tools.release.browser_smoke
          --base-url http://127.0.0.1:8083
          --api-base-url http://127.0.0.1:8082/api
          --artifacts .release/browser-smoke

      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-smoke-logs
          path: |
            backend-smoke.log
            web-smoke.log
            .release/browser-smoke/

      - name: Build PWA web bundle
        working-directory: mobile
        run: >
          flutter build web --release --no-pub --pwa-strategy=offline-first
          --dart-define=APP_ENV=production
          --dart-define=API_BASE_URL=/api
          -o build/web-pwa

  docker-verify:
    name: Docker — Build & Trivy scan
    needs: [backend, frontend]
    permissions:
      contents: read
    uses: ./.github/workflows/container-verify.yml

  build-apk:
    name: Release — Build APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web-smoke, docker-verify]
    permissions:
      contents: read
    uses: ./.github/workflows/release-apk.yml
