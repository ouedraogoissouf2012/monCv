name: CI — Build & Test

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  # ── Backend (Spring Boot) ──────────────────────────────────
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cvmobile_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build & Test
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/cvmobile_test
          DB_USERNAME: postgres
          DB_PASSWORD: test
          JWT_SECRET: ci-test-secret-key-minimum-32-characters-long!!
          DEEPSEEK_API_KEY: ""
        run: mvn clean verify -q

  # ── Frontend (Flutter) ─────────────────────────────────────
  frontend:
    name: Frontend — Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        working-directory: mobile
        run: flutter test --no-pub --exclude-tags web-smoke --concurrency=1

  # ── Smoke E2E Web (backend réel + Flutter Web) ───────────────
  web-smoke:
    name: Web Smoke E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cvmobile_smoke
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Start backend
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/cvmobile_smoke
          DB_USERNAME: postgres
          DB_PASSWORD: test
          JWT_SECRET: ci-smoke-secret-key-minimum-32-characters-long!!
          DEEPSEEK_API_KEY: ""
          SERVER_PORT: 8082
          ALLOWED_ORIGINS: "http://localhost:*,http://127.0.0.1:*"
        run: |
          nohup mvn spring-boot:run -q > ../backend-smoke.log 2>&1 &
          echo $! > ../backend-smoke.pid

      - name: Wait for backend
        run: |
          for i in {1..90}; do
            if curl -fsS http://localhost:8082/actuator/health; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy"
          tail -n 200 backend-smoke.log || true
          exit 1

      - name: Build web release
        working-directory: mobile
        run: flutter build web --release --no-pub --dart-define=API_BASE_URL=http://localhost:8082/api

      - name: Run web smoke
        working-directory: mobile
        run: flutter test test/e2e/cv_smoke_web_test.dart --platform chrome --no-pub --tags web-smoke --timeout 3m --reporter expanded --file-reporter json:../web-smoke-test-results.json --dart-define=API_BASE_URL=http://localhost:8082/api

      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-logs
          path: |
            backend-smoke.log
            web-smoke-test-results.json

  # ── Build APK (sur tags release) ───────────────────────────
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: [backend, frontend, web-smoke]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: stable

      - name: Build APK
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
