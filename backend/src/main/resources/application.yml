spring:
  application:
    name: cv-mobile-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cvmobile}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8082}

# Upload
upload:
  dir: ${UPLOAD_DIR:${user.home}/cv-uploads/photos}

# CORS — valeur sans default en base, chaque profil fixe la sienne
cors:
  allowed-origins: ${ALLOWED_ORIGINS}

# JWT — secret sans default en base (chaque profil le gere)
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

# AI Configuration (DeepSeek — compatible OpenAI)
ai:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${AI_MODEL:deepseek-chat}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
  fallback:
    enabled: ${AI_FALLBACK_ENABLED:true}

notifications:
  firebase:
    enabled: ${FIREBASE_NOTIFICATIONS_ENABLED:false}
  stale-cv-days: ${STALE_CV_DAYS:30}
  reminder-cron: ${NOTIFICATION_REMINDER_CRON:0 0 9 * * *}

# Actuator / Monitoring
management:
  prometheus:
    allowed-ip-ranges: ${MANAGEMENT_PROMETHEUS_ALLOWED_IP_RANGES:127.0.0.1/32,::1/128}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,retries
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:${SPRING_PROFILES_ACTIVE:dev}}
  send-default-pii: false
  ignored-exceptions-for-type:
    - org.springframework.security.authentication.BadCredentialsException
    - org.springframework.web.bind.MethodArgumentNotValidException
    - jakarta.validation.ValidationException

# Resilience4j : retry + circuit breaker + timeout pour les appels IA
resilience4j:
  retry:
    instances:
      ai-deepseek:
        max-attempts: 3                  # 1 initial + 2 retries
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.3
        retry-exceptions:
          - com.cvmobile.exception.ai.AiProviderDownException
        ignore-exceptions:
          - com.cvmobile.exception.ai.AiKeyInvalidException
          - com.cvmobile.exception.ai.AiQuotaExceededException
          - com.cvmobile.exception.ai.AiParseException
  circuitbreaker:
    instances:
      ai-deepseek:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.cvmobile.exception.ai.AiProviderDownException
        ignore-exceptions:
          - com.cvmobile.exception.ai.AiKeyInvalidException
          - com.cvmobile.exception.ai.AiQuotaExceededException
  timelimiter:
    instances:
      ai-deepseek:
        timeout-duration: 10s
        cancel-running-future: true

info:
  app:
    name: MonCV Backend
    version: 1.0.0
    description: API de creation de CV professionnels

# Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
