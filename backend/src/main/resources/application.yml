spring:
  application:
    name: cv-mobile-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/cvmobile}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 6MB

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8082}

# Envoi d'email (issue #381) — desactive par defaut (LoggingPasswordResetEmailSender simule l'envoi)
mail:
  enabled: ${MAIL_ENABLED:false}
  from: ${MAIL_FROM:no-reply@moncv.app}

# URL du frontend utilisee pour construire les liens envoyes par email (reinitialisation de mot de passe)
app:
  frontend-url: ${FRONTEND_URL:http://localhost:8080}

# Upload
upload:
  dir: ${UPLOAD_DIR:${user.home}/cv-uploads/photos}

# CORS — valeur sans default en base, chaque profil fixe la sienne
cors:
  allowed-origins: ${ALLOWED_ORIGINS}

# JWT — secret sans default en base (chaque profil le gere)
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

google:
  auth:
    client-id: ${GOOGLE_CLIENT_ID:}

# AI Configuration (DeepSeek — compatible OpenAI)
ai:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${AI_MODEL:deepseek-chat}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
  fallback:
    enabled: ${AI_FALLBACK_ENABLED:true}
  # Limites conservatrices pour garder une analyse lisible et maitriser les tokens.
  job-match:
    default-score: ${AI_JOB_MATCH_DEFAULT_SCORE:50}
    max-keywords: ${AI_JOB_MATCH_MAX_KEYWORDS:14}
    max-suggestions: ${AI_JOB_MATCH_MAX_SUGGESTIONS:6}
    max-fallback-suggestions: ${AI_JOB_MATCH_MAX_FALLBACK_SUGGESTIONS:5}
    max-recommendations: ${AI_JOB_MATCH_MAX_RECOMMENDATIONS:5}
    max-score: ${AI_JOB_MATCH_MAX_SCORE:100}
    completion-tokens: ${AI_JOB_MATCH_COMPLETION_TOKENS:1800}
  suggestions:
    max-suggestions: ${AI_SUGGESTIONS_MAX_ITEMS:5}
    completion-tokens: ${AI_SUGGESTIONS_COMPLETION_TOKENS:600}
  enhancement:
    completion-tokens: ${AI_ENHANCEMENT_COMPLETION_TOKENS:3000}

# Le score qualite part de 100; les penalites privilegient les sections utiles aux recruteurs.
cv:
  quality:
    initial-score: ${CV_QUALITY_INITIAL_SCORE:100}
    penalty-missing-profile: ${CV_QUALITY_PENALTY_MISSING_PROFILE:20}
    penalty-short-description: ${CV_QUALITY_PENALTY_SHORT_DESCRIPTION:10}
    penalty-cliche: ${CV_QUALITY_PENALTY_CLICHE:5}
    penalty-ai-trace: ${CV_QUALITY_PENALTY_AI_TRACE:5}
    minimum-profile-length: ${CV_QUALITY_MINIMUM_PROFILE_LENGTH:100}
    minimum-experience-description-length: ${CV_QUALITY_MINIMUM_EXPERIENCE_DESCRIPTION_LENGTH:80}
    max-skills-displayed: ${CV_QUALITY_MAX_SKILLS_DISPLAYED:10}

# Quotas anti-abus distribues entre les instances via Bucket4j et Redis.
security:
  request-body:
    max-json-bytes: ${MAX_JSON_REQUEST_BYTES:1048576}
    max-cv-json-bytes: ${MAX_CV_JSON_REQUEST_BYTES:8388608}
  public-portfolio:
    encryption-key: ${PUBLIC_LINK_ENCRYPTION_KEY}
    view-deduplication-window: ${PUBLIC_VIEW_DEDUPLICATION_WINDOW:5m}
    max-concurrent-documents: ${PUBLIC_MAX_CONCURRENT_DOCUMENTS:2}
    document-acquire-timeout: ${PUBLIC_DOCUMENT_ACQUIRE_TIMEOUT:250ms}
    max-document-bytes: ${PUBLIC_MAX_DOCUMENT_BYTES:10485760}
    allowed-media-origins: ${PUBLIC_MEDIA_ALLOWED_ORIGINS:}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:false}
    admin-bypass: ${RATE_LIMIT_ADMIN_BYPASS:true}
    auth-requests: ${RATE_LIMIT_AUTH_REQUESTS:10}
    auth-window: ${RATE_LIMIT_AUTH_WINDOW:1m}
    ai-requests: ${RATE_LIMIT_AI_REQUESTS:20}
    ai-window: ${RATE_LIMIT_AI_WINDOW:1h}
    import-requests: ${RATE_LIMIT_IMPORT_REQUESTS:5}
    import-window: ${RATE_LIMIT_IMPORT_WINDOW:1h}
    public-requests: ${RATE_LIMIT_PUBLIC_REQUESTS:60}
    public-window: ${RATE_LIMIT_PUBLIC_WINDOW:1m}
    public-download-requests: ${RATE_LIMIT_PUBLIC_DOWNLOAD_REQUESTS:6}
    public-download-window: ${RATE_LIMIT_PUBLIC_DOWNLOAD_WINDOW:1m}
    public-share-requests: ${RATE_LIMIT_PUBLIC_SHARE_REQUESTS:20}
    public-share-window: ${RATE_LIMIT_PUBLIC_SHARE_WINDOW:1m}
    redis-url: ${RATE_LIMIT_REDIS_URL:redis://localhost:6379}
    key-prefix: ${RATE_LIMIT_KEY_PREFIX:moncv:rate-limit:}

notifications:
  firebase:
    enabled: ${FIREBASE_NOTIFICATIONS_ENABLED:false}
  stale-cv-days: ${STALE_CV_DAYS:30}
  reminder-cron: ${NOTIFICATION_REMINDER_CRON:0 0 9 * * *}

# Actuator / Monitoring
management:
  prometheus:
    allowed-ip-ranges: ${MANAGEMENT_PROMETHEUS_ALLOWED_IP_RANGES:127.0.0.1/32,::1/128}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,retries
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:${SPRING_PROFILES_ACTIVE:dev}}
  send-default-pii: false
  ignored-exceptions-for-type:
    - org.springframework.security.authentication.BadCredentialsException
    - org.springframework.web.bind.MethodArgumentNotValidException
    - jakarta.validation.ValidationException

# Resilience4j : retry + circuit breaker + timeout pour les appels IA
resilience4j:
  retry:
    instances:
      ai-deepseek:
        max-attempts: 3                  # 1 initial + 2 retries
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.3
        retry-exceptions:
          - com.cvmobile.exception.ai.AiProviderDownException
        ignore-exceptions:
          - com.cvmobile.exception.ai.AiKeyInvalidException
          - com.cvmobile.exception.ai.AiQuotaExceededException
          - com.cvmobile.exception.ai.AiParseException
  circuitbreaker:
    instances:
      ai-deepseek:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.cvmobile.exception.ai.AiProviderDownException
        ignore-exceptions:
          - com.cvmobile.exception.ai.AiKeyInvalidException
          - com.cvmobile.exception.ai.AiQuotaExceededException
  timelimiter:
    instances:
      ai-deepseek:
        timeout-duration: 10s
        cancel-running-future: true

info:
  app:
    name: MonCV Backend
    version: 1.0.0
    description: API de creation de CV professionnels

# Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
