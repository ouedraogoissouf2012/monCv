# Profil dev — mode degrade autorise pour DeepSeek

spring:
  datasource:
    password: ${DB_PASSWORD}

  jpa:
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# CORS — accepte les ports dynamiques de Flutter Web en developpement
cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://10.0.2.2:8082}

# JWT — valeur locale uniquement, interdite en production
jwt:
  secret: ${JWT_SECRET:moncv-dev-only-A7zQ9mK2xR8pL4vN6sT1wY5cD3fH0jU7eB9gM2qX8kP4rV6nZ}

# AI — DeepSeek optionnel en dev (mode degrade accepte)
ai:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}

# Actuator — details complets en dev pour le debug
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.cvmobile: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
