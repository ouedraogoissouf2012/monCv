# Profil dev — mode degrade autorise pour DeepSeek

spring:
  datasource:
    password: ${DB_PASSWORD}

  # Les worktrees peuvent appliquer une migration plus recente avant une
  # migration issue d'une autre branche. Autoriser Flyway a combler ce trou
  # uniquement en developpement; le profil prod conserve la validation stricte.
  flyway:
    out-of-order: ${FLYWAY_OUT_OF_ORDER:true}

  jpa:
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# CORS — accepte les ports dynamiques de Flutter Web en developpement
cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://10.0.2.2:8082}

# JWT — valeur locale uniquement, interdite en production
jwt:
  secret: ${JWT_SECRET:moncv-dev-only-A7zQ9mK2xR8pL4vN6sT1wY5cD3fH0jU7eB9gM2qX8kP4rV6nZ}

security:
  public-portfolio:
    encryption-key: ${PUBLIC_LINK_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    allowed-media-origins: ${PUBLIC_MEDIA_ALLOWED_ORIGINS:http://localhost:8082,http://127.0.0.1:8082}

# AI — DeepSeek optionnel en dev (mode degrade accepte)
ai:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}

# Actuator — details complets en dev pour le debug
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.cvmobile: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
